<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title & Favicon -->
    <title>Classmap</title>
    <!-- SVG first: browsers that support it get a mark that stays crisp at any
         size and on any display. The .ico is the fallback and carries a
         simplified 16px drawing, since the full mark blurs at that size. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6321" />

    <!-- Core SEO Meta Tags -->
    <meta name="description" content="Classmap goes beyond report cards to reveal WHY students struggle through handwritten assessment evaluation, concept-level gap analysis, and learning graph intelligence." />
    <meta name="keywords" content="Classmap, Learning Gap Intelligence, Handwritten Answer Sheet Evaluation, School Analytics, AI Grading, CBSE, ICSE, DBSE, K-12 Education India" />
    <meta name="author" content="Classmap" />
    <meta name="robots" content="index, follow" />

    <!-- GEO Meta Tags (Location & Regional Optimization) -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="geo.position" content="20.5937;78.9629" />
    <meta name="ICBM" content="20.5937, 78.9629" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://classmap.in/" />
    <meta property="og:title" content="Classmap — Learning Gap Intelligence Platform" />
    <meta property="og:description" content="Empowering schools and coaching institutes across India with handwritten AI answer sheet evaluation and concept gap analytics." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Classmap — Learning Gap Intelligence Platform" />
    <meta name="twitter:description" content="Transform student assessments into actionable learning insights with Classmap." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CLASSMAP_TAG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CLASSMAP_TAG', { page_path: window.location.pathname });
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FDFCFB] text-[#1A1A1A] font-sans antialiased selection:bg-[#FF6321]/20 selection:text-[#FF6321]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
