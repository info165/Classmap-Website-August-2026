<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ClassMap">
  <!-- White tile behind the mark, filling the icon so the white sits centred
       behind the logo at every size. Solid rather than transparent, so the mark
       keeps its own colour against dark browser chrome instead of disappearing. -->
  <rect width="512" height="512" rx="114" fill="#FFFFFF"/>
  <!-- The chart mark from the ClassMap logo, scaled from its native 91x86
       bounds to a centred box. The scale factor sets how much of the tile the
       mark fills; 4.2 leaves roughly a 13% margin. -->
  <g transform="translate(1.9 8.2) scale(4.2)" fill="#FF6321">
    <rect x="15" y="98" width="110" height="4" rx="2"/>
    <rect x="25" y="68" width="12" height="26" rx="2"/>
    <rect x="48" y="48" width="12" height="46" rx="2"/>
    <rect x="71" y="58" width="12" height="36" rx="2"/>
    <rect x="94" y="38" width="12" height="56" rx="2"/>
    <polyline points="28,52 54,28 77,44 100,22" fill="none" stroke="#FF6321" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="52" r="5"/>
    <circle cx="54" cy="28" r="5"/>
    <circle cx="77" cy="44" r="5"/>
    <circle cx="100" cy="22" r="6"/>
  </g>
</svg>
