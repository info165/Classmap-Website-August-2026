<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ClassMap">
  <!-- Brand tile. A solid fill rather than a transparent mark, so the icon holds
       its shape against both light and dark browser chrome at 16px. -->
  <rect width="512" height="512" rx="114" fill="#FF6321"/>
  <!-- The chart mark from the ClassMap logo, reversed out in white and scaled
       from its native 91x86 bounds to a centred, padded box. -->
  <g transform="translate(38.2 43.6) scale(3.6)" fill="#FFFFFF">
    <rect x="15" y="98" width="110" height="4" rx="2"/>
    <rect x="25" y="68" width="12" height="26" rx="2"/>
    <rect x="48" y="48" width="12" height="46" rx="2"/>
    <rect x="71" y="58" width="12" height="36" rx="2"/>
    <rect x="94" y="38" width="12" height="56" rx="2"/>
    <polyline points="28,52 54,28 77,44 100,22" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="52" r="5"/>
    <circle cx="54" cy="28" r="5"/>
    <circle cx="77" cy="44" r="5"/>
    <circle cx="100" cy="22" r="6"/>
  </g>
</svg>
